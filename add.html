<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Student | SMS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-shell">

  <aside class="sidebar">
    <div class="sidebar-top">
      <a href="index.html" class="brand">SMS</a>
    </div>
    <nav class="sidebar-nav">
      <a href="index.html">🏠 Home</a>
      <a href="dashboard.html">📊 Dashboard</a>
      <a href="add.html" class="active">➕ Add Student</a>
      <a href="manage.html">🗂️ Manage Students</a>
    </nav>
    <div class="sidebar-foot">BSc CSIT</div>
  </aside>

  <div class="main-wrap">
    <header class="topbar">
      <div>
        <p class="eyebrow">Student Information</p>
        <h1 id="formTitle">Add Student</h1>
        <p>Enter the student's personal and academic information.</p>
      </div>
      <a href="manage.html" class="back-btn">← Back to Students</a>
    </header>

    <main>
      <section class="form-card">
        <form id="studentForm">
          <div class="form-grid">
            <div class="form-group"><label for="name">Full Name</label><input type="text" id="name" placeholder="Enter full name" required></div>
            <div class="form-group"><label for="email">Email</label><input type="email" id="email" placeholder="student@example.com" required></div>
            <div class="form-group"><label for="contact">Contact</label><input type="tel" id="contact" placeholder="98XXXXXXXX" required></div>
            <div class="form-group"><label for="address">Address</label><input type="text" id="address" placeholder="Kathmandu, Nepal" required></div>
            <div class="form-group">
              <label for="faculty">Faculty</label>
              <select id="faculty" required>
                <option value="">Select Faculty</option>
                <option>BSc CSIT</option><option>BIT</option><option>B.TECH</option>
                <option>BBA</option><option>BBS</option><option>BA</option><option>BFA</option>
              </select>
            </div>
            <div class="form-group">
              <label for="semester">Semester</label>
              <select id="semester" required>
                <option value="">Select Semester</option>
                <option value="1">First Semester</option>
                <option value="2">Second Semester</option>
                <option value="3">Third Semester</option>
                <option value="4">Fourth Semester</option>
                <option value="5">Fifth Semester</option>
                <option value="6">Sixth Semester</option>
              </select>
            </div>
          </div>
          <div class="form-actions">
            <a href="manage.html" class="print-btn">Cancel</a>
            <button type="submit" id="submitBtn" class="edit-btn">Add Student</button>
          </div>
        </form>
      </section>
    </main>
  </div>

</div>
<script src="script.js"></script>
</body>
</html>
